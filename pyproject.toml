[project]
name = "pqc-fpga-accelerator"
version = "0.1.0"
description = "Golden model and host tools for a unified ML-KEM / ML-DSA NTT accelerator on FPGA"
requires-python = ">=3.12"
dependencies = [
    "pyserial>=3.5",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
markers = ["slow: long exhaustive regressions; run with -m slow, skip with -m 'not slow'"]
